apiVersion: v2
name: semantic-operator
description: >
  Apache Ossie semantic layer for Kubernetes: SemanticModel CRD and operator, a
  deterministic semantic planner with compile-time governance, and MCP/REST
  serving adapters for existing StarRocks or Trino query engines. Valkey caching
  is optional.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
keywords: [semantic-layer, ossie, starrocks, iceberg, mcp]
sources:
  - https://github.com/kubeflow/semantic-operator
